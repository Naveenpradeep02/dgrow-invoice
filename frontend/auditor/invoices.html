<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Invoices - Auditor Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-header">
        <img src="../assets/Logo.png" onerror="this.onerror=null; this.src='assets/Logo.png'; if(!this.complete) this.src='/assets/Logo.png';" alt="D-GROW Marketing Agency" class="brand-logo-img">
      </div>
      <ul class="nav-list">
        <li class="nav-item"><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Audit Dashboard</a></li>
        <li class="nav-item active"><a href="invoices.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Financial Invoices</a></li>
        <li class="nav-item"><a href="reports.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> Tax & Sales Reports</a></li>
      </ul>
      <div class="sidebar-user">
        <div class="user-info"><p id="sidebarUserName">Auditor</p><span id="sidebarUserRole">AUDITOR</span></div>
        <button class="btn-logout" onclick="handleLogout()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div class="page-title">
          <h1>Financial Invoices Audit Register</h1>
          <p>Read-only access to all issued, paid, and cancelled agency invoices.</p>
        </div>
      </div>

      <div class="card" style="padding: 1rem; margin-bottom: 1.5rem;">
        <div style="display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
          <input type="text" id="filterSearch" class="form-input" placeholder="Search Invoice No or Client..." style="flex:2; min-width:200px;" oninput="loadInvoicesList()">
          
          <select id="filterMonth" class="form-select" style="flex:1; min-width:125px;" onchange="onAuditorDateFilterChange()">
            <option value="">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>

          <select id="filterYear" class="form-select" style="flex:1; min-width:100px;" onchange="onAuditorDateFilterChange()">
            <option value="">All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
            <option value="2027">2027</option>
          </select>

          <select id="filterStatus" class="form-select" style="flex:1; min-width:125px;" onchange="loadInvoicesList()">
            <option value="">All Statuses</option>
            <option value="ISSUED">ISSUED</option>
            <option value="PAID">PAID</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
        </div>
      </div>

      <div class="card" style="padding: 0;">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Invoice No</th>
                <th>Date</th>
                <th>Client Company</th>
                <th>Type</th>
                <th>Grand Total</th>
                <th>Paid Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="invoicesTableBody">
              <tr><td colspan="8" class="text-center">Loading invoices...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/invoice.js"></script>
</body>
</html>
