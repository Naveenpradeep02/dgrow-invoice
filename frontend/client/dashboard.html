<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal - D-GROW Invoice System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand-header">
        <img src="../assets/Logo.png" onerror="this.onerror=null; this.src='assets/Logo.png'; if(!this.complete) this.src='/assets/Logo.png';" alt="D-GROW Marketing Agency" class="brand-logo-img">
      </div>
      <ul class="nav-list">
        <li class="nav-item active"><a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> My Invoices</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <!-- Top Navbar Header -->
      <header class="top-navbar">
        <div class="top-navbar-left">
          <div class="topbar-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" placeholder="Quick search my invoices..." id="globalQuickSearch" onkeydown="handleGlobalSearch(event)">
          </div>
        </div>

        <div class="top-navbar-right">
          <!-- User Profile Dropdown Menu with Logout -->
          <div class="nav-dropdown-wrapper" id="profileDropdownWrapper">
            <button type="button" class="topbar-user-btn" id="userProfileToggleBtn" onclick="toggleUserProfileDropdown(event)">
              <div class="user-avatar-circle" style="background: linear-gradient(135deg, #10b981, #059669);">
                <span id="topbarUserInitials">CL</span>
              </div>
              <div class="topbar-user-text">
                <span class="user-name" id="topbarUserName">Client</span>
                <span class="user-role-badge" id="topbarUserRole" style="color:#059669;">CLIENT</span>
              </div>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-chevron"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            <div class="nav-dropdown-menu profile-dropdown-menu" id="profileDropdownMenu">
              <div class="profile-dropdown-header">
                <div class="profile-avatar-large" style="background: linear-gradient(135deg, #10b981, #059669);">
                  <span id="dropdownAvatarInitials">CL</span>
                </div>
                <div class="profile-header-info">
                  <strong id="dropdownUserName">Client Account</strong>
                  <span id="dropdownUserEmail">client@portal.com</span>
                  <span class="badge" style="background:#d1fae5; color:#065f46; margin-top:0.25rem; font-size:0.7rem; align-self:flex-start;" id="dropdownUserRole">CLIENT PORTAL</span>
                </div>
              </div>
              
              <div class="profile-dropdown-footer">
                <button type="button" class="profile-logout-btn" onclick="handleLogout()">
                  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Sign Out / Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div class="page-header">
        <div class="page-title">
          <h1>Client Documents & Billing</h1>
          <p>View your agency invoices, payment status, and download official PDF receipts.</p>
        </div>
      </div>

      <div class="card" style="padding:0;">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Invoice No</th>
                <th>Date</th>
                <th>Due Date</th>
                <th>Type</th>
                <th>Grand Total</th>
                <th>Paid Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="invoicesTableBody">
              <tr><td colspan="8" class="text-center" style="padding:2rem;">Loading your invoices...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/invoice.js"></script>
</body>
</html>
