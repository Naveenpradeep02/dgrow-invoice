<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - D-GROW Marketing Agency Invoice System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrapper {
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(220, 38, 38, 0.12), 0 0 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      border-top: 5px solid #dc2626;
      padding: 2.5rem 2.25rem;
      text-align: center;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .logo-img {
      max-height: 70px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    }
    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 0.2rem;
      margin-bottom: 1.5rem;
    }
    .demo-pills-wrapper {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .demo-pills-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #dc2626;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 0.5rem;
    }
    .demo-buttons {
      display: flex;
      gap: 0.5rem;
    }
    .btn-pill {
      flex: 1;
      padding: 0.55rem 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .btn-pill:hover {
      border-color: #dc2626;
      color: #dc2626;
      background: #fef2f2;
      transform: translateY(-1px);
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.15rem;
    }
    .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .form-input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      font-size: 0.9rem;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-input:focus {
      background: #ffffff;
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #b91c1c, #991b1b);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.4);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <!-- Logo with fallbacks for Live Server and Express -->
        <img src="assets/Logo.png" onerror="this.onerror=null; this.src='./assets/Logo.png'; if(!this.complete) this.src='/assets/Logo.png';" alt="D-GROW Marketing Agency Logo" class="logo-img">
      </div>
      <h2 class="login-title">D-GROW MARKETING</h2>
      <p class="login-subtitle">Invoice & Accounting Management Portal</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@agency.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">
          Sign In to System →
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js" onerror="this.src='/js/api.js'"></script>
  <script src="js/auth.js" onerror="this.src='/js/auth.js'"></script>
</body>
</html>
